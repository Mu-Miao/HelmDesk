name: Mac local build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - name: Swift tests
        run: swift test --package-path native --scratch-path "$RUNNER_TEMP/HelmDesk-SwiftPM" -Xswiftc -warnings-as-errors
      - run: node scripts/check-publication.mjs
      - name: Build and audit local package
        run: ./script/distribute_macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HelmDesk-local-macos
          path: dist/releases/HelmDesk-*-local/
          if-no-files-found: error
          retention-days: 7
